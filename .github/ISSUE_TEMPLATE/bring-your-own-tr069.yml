name: Bring Your Own TR-069
description: Share a public firmware source, fingerprint, implementation or attribution correction.
title: "[BYO TR-069] "
body:
  - type: markdown
    attributes:
      value: |
        We have the banners. You may have the firmware.

        See the [wanted list](https://github.com/scadastrangelove/TRON-069/blob/main/WANTED.md).
        Partial evidence is welcome. Use "unknown" where necessary.

        **This issue is public.** Share links and sanitized fingerprints only.
        Do not attach firmware, raw dumps, configurations, credentials, device addresses
        or unpublished vulnerability details. For non-public material, ask only to
        arrange a private transfer and wait for an agreed channel before sharing it.
  - type: input
    id: target
    attributes:
      label: Search or implementation
      description: The prefilled search ID, another implementation, or the attribution you want to correct.
      placeholder: cwmp-server, another signature, or a correction
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Public source and provenance
      description: Public download, GPL archive or documentation URL; explain how it relates to the search. If no public source exists, request a transfer channel here without attaching material.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Model, hardware revision and firmware version
      placeholder: Include known details; leave unknown parts explicit.
  - type: input
    id: deployment
    attributes:
      label: Country and operator
      description: Context only; omit subscriber details, IP addresses and private ACS URLs.
  - type: textarea
    id: fingerprint
    attributes:
      label: Sanitized fingerprint and observation date
      description: Relevant response markers, date, source and observation method. Remove addresses, serial numbers, tokens and credentials. No vulnerability reproductions.
      render: text
  - type: input
    id: checksum
    attributes:
      label: Original filename and SHA-256
      description: Optional. Do not attach the image or binary.
  - type: input
    id: credit
    attributes:
      label: Contributor credit
      description: Preferred name or public profile, or "no public credit". Your GitHub account remains visible on this issue.
  - type: checkboxes
    id: publication
    attributes:
      label: Public submission
      options:
        - label: I have included only public links and sanitized evidence, or a request to arrange a private transfer. No firmware attachments, secrets, device addresses or unpublished vulnerability details.
          required: true
